; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ESP32-C3 with Arduino BLE + Adafruit_GFX needs more than the
; default 1.2MB app partition. huge_app gives 3MB app, no OTA.
board_build.partitions = huge_app.csv

; Native USB CDC + JTAG (GPIO18/19). lolin_c3_mini exposes the
; ESP32-C3 USB-Serial-JTAG directly; no CH340 onboard.
build_flags = 
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_TINYUSB=1
  -DCORE_DEBUG_LEVEL=5  ; Set the debug level (0-5, with 5 being the most verbose)

lib_deps =
    olikraus/U8g2@^2.35.30
    h2zero/NimBLE-Arduino@^1.4.2

